<div
  class="relative min-h-screen flex flex-col justify-center items-center space-y-1 py-16 text-center mt-20"
>
  @switch (status()) {
    @case ('pending') {
      <mat-spinner diameter="32" />
      <p>Confirming your payment...</p>
    }
    @case ('paid') {
      <h2 class="text-xl font-medium text-green-700">Payment successful</h2>
      @if (order(); as confirmedOrder) {
        <app-order-details [order]="confirmedOrder" class="w-full max-w-2xl text-left" />
      } @else {
        <mat-spinner diameter="32" />
        <p>Loading your order...</p>
      }
      <a routerLink="/orders" mat-stroked-button>View all orders</a>
    }
    @case ('failed') {
      <h2 class="text-xl font-medium">Payment failed</h2>
      <a routerLink="/checkout" mat-stroked-button>Try again</a>
    }
    <!--     @case ('unknown') {
      <h2 class="text-xl font-medium">Almost there</h2>
      <p>We're confirming this with the payment provider — check your orders page in a moment.</p>
      <a routerLink="/orders" mat-stroked-button>View your orders</a>
    } -->
  }
</div>
