<div class="max-w-3xl mx-auto p-8">
  <h2 class="text-xl font-medium mb-6">Your orders</h2>

  @if (loading()) {
    <div class="flex justify-center py-16">
      <mat-spinner diameter="32" />
    </div>
  } @else if (orders().length === 0) {
    <app-empty-state
      icon="receipt_long"
      title="No orders yet"
      message="Your past orders will show up here once you make a purchase."
    >
      <a mat-flat-button routerLink="/shop" emptyStateAction>Browse products</a>
    </app-empty-state>
  } @else {
    <div class="bg-white p-8 space-y-3 rounded-2xl border border-neutral-300">
      @for (order of orders(); track order.id) {
        <a
          [routerLink]="['/orders', order.id]"
          class="block border border-neutral-200 rounded-xl p-4 hover:border-neutral-400 transition-colors"
        >
          <div class="flex justify-between items-center">
            <div>
              <p class="font-medium">Order #{{ order.id }}</p>
              <p class="text-sm text-gray-500">{{ order.orderDate | date: 'medium' }}</p>
            </div>
            <div class="text-right">
              <p class="font-medium">{{ order.total | currency }}</p>
              <span
                class="text-sm px-2 py-0.5 rounded-full bg-green-100 text-green-800 capitalize"
                >{{ order.status }}</span
              >
            </div>
          </div>
        </a>
      }
    </div>
  }
</div>
