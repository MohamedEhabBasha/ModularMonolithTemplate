<!-- Product Item -->
<mat-card
  class="flex! flex-col! h-full! rounded-xl! shadow-sm! hover:shadow-md! transition-shadow product-card"
  [routerLink]="['/shop/product/', product().id]"
>
  <div class="relative w-full aspect-square overflow-hidden bg-gray-100 rounded-t-xl">
    <img
      [src]="product().pictureUrl"
      [alt]="product().name"
      class="w-full h-full object-cover"
      loading="lazy"
    />
  </div>

  <mat-card-content class="flex! flex-col! flex-1! p-3! gap-1!">
    <h3 class="text-sm font-semibold text-gray-900 line-clamp-1">
      {{ product().name }}
    </h3>

    <div class="flex items-center gap-1.5">
      @if (product().sellerPictureUrl) {
        <img
          [src]="product().sellerPictureUrl"
          [alt]="product().sellerBrandName"
          class="h-5 w-5 rounded-full object-cover bg-gray-100"
        />
      } @else {
        <span
          class="flex h-5 w-5 items-center justify-center rounded-full bg-gray-200 text-[10px] font-medium text-gray-600"
        >
          {{ product().sellerBrandName.charAt(0) }}
        </span>
      }
      <span class="text-xs text-gray-500 line-clamp-1">{{ product().sellerBrandName }}</span>
    </div>

    <p class="text-xs text-gray-500 line-clamp-2 flex-1">
      {{ product().description }}
    </p>
    <p class="text-base font-bold text-gray-900 mt-1">
      {{ product().price | currency }}
    </p>
  </mat-card-content>

  <mat-card-actions class="p-3! pt-0!" (click)="$event.stopPropagation()">
    <button mat-flat-button color="primary" class="w-full!" (click)="onAddToCart()">
      <mat-icon>add_shopping_cart</mat-icon>
      Add to cart
    </button>
  </mat-card-actions>
</mat-card>
