<main class="min-h-screen">
  <section class="flex h-[45vh] items-center gap-6 bg-neutral-900 px-8 text-white">
    @if (photoUrl()) {
      <img
        [src]="photoUrl()"
        [alt]="fullName()"
        class="h-24 w-24 shrink-0 rounded-full object-cover ring-4 ring-white/10"
      />
    } @else {
      <span
        class="flex h-24 w-24 shrink-0 items-center justify-center rounded-full bg-neutral-700 text-2xl font-semibold ring-4 ring-white/10"
      >
        {{ initials() }}
      </span>
    }
    <div class="flex flex-col gap-1">
      <p class="text-sm uppercase tracking-wide text-neutral-400">Administrator</p>
      <h1 class="text-2xl font-semibold">{{ fullName() }}</h1>
    </div>
  </section>
  <mat-tab-group class="px-4">
    <mat-tab label="Pending Products">
      <div class="py-4">
        <app-pending-products></app-pending-products>
      </div>
    </mat-tab>
  </mat-tab-group>
</main>
