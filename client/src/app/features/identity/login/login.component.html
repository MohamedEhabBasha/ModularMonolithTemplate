<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white border border-gray-200 rounded-lg p-8">
    <h1 class="text-2xl font-semibold text-secondary mb-6 text-center">Sign in</h1>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
      <app-text-field
        [control]="loginForm.controls.email"
        label="Email"
        type="email"
        autocomplete="email"
        [errorMessages]="{ required: 'Email is required', email: 'Enter a valid email address' }"
      />

      <app-password-field
        [control]="loginForm.controls.password"
        label="Password"
        autocomplete="current-password"
        [errorMessages]="{ required: 'Password is required' }"
      />

      @if (serverValidationErrors(); as errors) {
        <ul role="alert" class="text-accent-red text-sm -mt-2 list-disc pl-5">
          @for (msg of errors; track msg) {
            <li>{{ msg }}</li>
          }
        </ul>
      }

      <button mat-flat-button type="submit" class="bg-secondary! text-white! w-full py-2! mt-2" [disabled]="loading()">
        @if (loading()) {
          <mat-progress-spinner diameter="20" mode="indeterminate" class="inline-block" />
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="text-sm text-center text-secondary mt-6">
      Don't have an account?
      <a routerLink="/account/register" class="text-accent-red hover:underline">Create one</a>
    </p>
  </div>
</div>
