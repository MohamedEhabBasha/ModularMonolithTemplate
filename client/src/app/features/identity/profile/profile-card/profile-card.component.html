<div
  class="flex flex-col items-center space-y-4 rounded-lg border border-gray-300 bg-white p-6 text-center shadow-sm"
>
  <img [src]="pictureUrl() ?? 'user.png'" alt="" class="h-24 w-24 rounded-full object-cover border-4 border-accent-red p-2" />
  <h2 class="text-lg font-medium">{{ name() }}</h2>
  @if (showEditButton()) {
    <button mat-stroked-button routerLink="/account/me/edit">
      <mat-icon>edit</mat-icon>
      Edit profile
    </button>
  }
</div>
