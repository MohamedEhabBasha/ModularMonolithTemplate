@if (sellerProfile(); as sp) {
  <app-profile-layout
    [pictureUrl]="sp.pictureUrl || null"
    [name]="displayName()"
    [showEditButton]="isOwner()"
  >
    <mat-tab-group>
      <mat-tab label="About">
        <div class="p-4 text-gray-500">Coming soon.</div>
      </mat-tab>
    </mat-tab-group>
  </app-profile-layout>
} @else {
  <div
    class="mx-auto max-w-7xl animate-pulse px-4 py-8 sm:px-6 lg:px-8"
    aria-busy="true"
    aria-live="polite"
  >
    <div class="flex flex-col gap-6 lg:flex-row lg:gap-8">
      <div
        class="flex flex-col items-center gap-3 rounded-lg border border-gray-200 bg-white p-6 lg:w-1/4"
      >
        <div class="h-24 w-24 rounded-full bg-neutral-200"></div>
        <div class="h-5 w-2/3 rounded bg-neutral-200"></div>
      </div>
      <div class="flex min-w-0 flex-col gap-3 lg:w-3/4">
        <div class="h-9 w-40 rounded bg-neutral-200"></div>
        <div class="h-32 w-full rounded bg-neutral-200"></div>
      </div>
    </div>
  </div>
}
