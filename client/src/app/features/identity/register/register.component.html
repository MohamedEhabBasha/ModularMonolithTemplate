<div class="min-h-[80vh] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-xl bg-white border border-gray-300 rounded-lg p-8">
    <h1 class="text-2xl font-semibold text-secondary mb-6 text-center">Create an account</h1>

    <form [formGroup]="registerForm" (ngSubmit)="submit()" novalidate class="flex flex-col gap-4">
      <div class="flex gap-3">
        <app-text-field
          class="w-1/2"
          [control]="registerForm.controls.firstName"
          label="First name"
          autocomplete="given-name"
          [errorMessages]="{ required: 'First name is required' }"
        />
        <app-text-field
          class="w-1/2"
          [control]="registerForm.controls.lastName"
          label="Last name"
          autocomplete="family-name"
          [errorMessages]="{ required: 'Last name is required' }"
        />
      </div>

      <app-text-field
        [control]="registerForm.controls.email"
        label="Email"
        type="email"
        autocomplete="email"
        [errorMessages]="{ required: 'Email is required', email: 'Enter a valid email address' }"
      />

      <app-radio-group-field
        [control]="registerForm.controls.accountType"
        [options]="accountTypeOptions"
        label="I want to"
        [errorMessages]="{ required: 'Please choose an account type' }"
      />

      <app-password-field
        [control]="registerForm.controls.password"
        label="Password"
        [showRequirements]="true"
        [errorMessages]="{ required: 'Password is required' }"
      />

      <app-password-field
        [control]="registerForm.controls.confirmPassword"
        label="Confirm password"
        [errorMessages]="{
          required: 'Please confirm your password',
          passwordsMismatch: 'Passwords do not match',
        }"
      />

      @if (serverValidationErrors(); as errors) {
        <ul role="alert" class="text-accent-red text-sm -mt-2 list-disc pl-5">
          @for (msg of errors; track msg) {
            <li>{{ msg }}</li>
          }
        </ul>
      }

      <button
        mat-flat-button
        type="submit"
        class="bg-secondary! text-white! w-full py-2! mt-2"
        [disabled]="loading()"
      >
        @if (loading()) {
          <mat-progress-spinner diameter="20" mode="indeterminate" class="inline-block" />
        } @else {
          Create account
        }
      </button>
    </form>

    <p class="text-sm text-center text-secondary mt-6">
      Already have an account?
      <a routerLink="/account/login" class="text-accent-red hover:underline">Sign in</a>
    </p>
  </div>
</div>
