<section
  class="relative flex flex-col min-h-[200vh] bg-linear-to-b from-[#520503] to-[#0C0000] overflow-hidden"
>
  <div
    #sellerCard
    class="hidden lg:block bg-[#0c0000] absolute top-[7%] left-0 w-90 border-2 rounded-4xl -rotate-6 z-99"
  >
    <img src="home/seller.avif" alt="" class="object-cover" />
  </div>
  <div
    #buyerCard
    class="hidden lg:block bg-[#0c0000] absolute top-[10%] right-0 xl:right-[7%] w-75 border-2 rounded-4xl rotate-20 xl:rotate-35 z-99"
  >
    <img src="home/buyer.avif" alt="" class="object-cover" />
  </div>
  <video
    src="home/cameraman2.webm"
    [muted]="true"
    loop
    autoplay
    class="absolute top-[3%] lg:top-[5%] left-[-5%] lg:left-[20%] opacity-20"
  ></video>
  <!-- Draw Line -->
  <div class="absolute top-[25%] left-[45%] -translate-1/2 hidden xl:block">
    <svg xmlns="http://www.w3.org/2000/svg" width="1075" height="676" fill="none">
      <path
        #drawLinePath
        stroke="#0c0000"
        stroke-linecap="round"
        stroke-opacity=".4"
        stroke-width="40"
        d="M15 215.493c4.208 144.969 80.427 436.787 351.644 444.303 271.217 7.515 446.618-174.627 492.903-303.939 82.086-229.335-173.959-428.83-336.015-300.623-202.572 160.259-78.645 331.501-60.712 353.674 158.691 196.204 485.476 2.292 596.68-183.387"
      />
    </svg>
  </div>
  <div
    class="absolute top-0 bottom-0 left-1/2 w-px bg-[repeating-linear-gradient(to_bottom,#ffffff33_0,#ffffff33_8px,transparent_8px,transparent_16px)]"
  ></div>
  <!-- Horizontal dashed line -->
  <div
    class="absolute left-0 right-0 top-1/2 h-px bg-[repeating-linear-gradient(to_right,#ffffff33_0,#ffffff33_8px,transparent_8px,transparent_16px)] hidden lg:block"
  ></div>
  <div class="relative h-screen">
    @if (canvasMounted()) {
      <app-three-canvas-host></app-three-canvas-host>
    } @else {
      <svg viewBox="0 0 109 185" class="absolute top-1/2 left-1/2 -translate-1/2 h-70 w-70" fill="none">
        <path
          fill="#fff"
          d="M108.512 98.448c-4.252-30.614-28.545-34.473-33.607-37.56a9.9 9.9 0 0 1-2.732-2.428l-.102-16.084C77.473 26.41 93.26 12.008 95.488 9.18c2.699-3.43-1.62-4.116-1.62-4.116-14.44-6.752-64.295-6.752-78.736 0 0 0-4.319.686-1.62 4.116 2.226 2.828 18.015 17.231 23.417 33.196l-.102 16.084c-.66.86-1.54 1.7-2.733 2.428-5.06 3.087-29.354 6.946-33.606 37.56-4.25 30.613 20.448 79.492 27.736 82.836 1.886.866 4.565 1.627 7.812 2.232v.083q1.863.285 3.73.509c4.33.578 9.36.905 14.734.892 5.374.013 10.405-.314 14.734-.892q1.867-.224 3.73-.509v-.083c3.246-.606 5.926-1.366 7.812-2.232 7.288-3.344 31.987-52.223 27.736-82.836"
        />
      </svg>
    }
    <h1
      #mainHeroStructure
      class="absolute bottom-[2%] left-1/2 -translate-x-1/2 block w-[95%] py-2 text-[1.8rem] md:text-[3rem] lg:text-6xl xl:text-[6rem] font-black font-orbitron leading-[0.9] uppercase tracking-tighter text-white"
    >
      <div #targetHeading class="flex justify-between items-center w-full overflow-hidden">
        <span #turnYourWord>Turn Your</span>
        <span #productsWord>Products</span>
      </div>

      <div
        #targetSubtitle
        class="flex justify-between text-center max-w-7xl mx-auto mt-4 xl:text-[5.2rem] overflow-hidden"
      >
        <span #intoAWord> Into a </span>
        <span #trustedWord>trusted</span>
        <span #businessWord> Business </span>
      </div>
    </h1>
  </div>

  <div class="relative h-[150vh] flex justify-center items-center lg:items-end lg:pb-40 px-4">
    <h2
      #paragraphText
      class="max-w-6xl text-4xl lg:text-7xl font-bold text-white text-center lg:text-left leading-tight tracking-tight"
    >
      <span class="opacity-0 hidden lg:inline-block">XXXXX</span>
      Create experiences customers trust, relationships that last, and value that grows beyond the
      checkout.
    </h2>
  </div>

  <div
    class="hidden lg:block absolute left-1/2 top-1/2 z-20 -translate-x-1/2 -translate-y-1/2 pointer-events-none"
  >
    <span
      class="absolute right-full top-1/2 mr-6 -translate-y-1/2 whitespace-nowrap font-orbitron text-sm uppercase tracking-widest text-white/70 md:mr-16 md:text-2xl"
      >Career</span
    >
    <span
      class="absolute left-full top-1/2 ml-6 -translate-y-1/2 whitespace-nowrap font-orbitron text-sm uppercase tracking-widest text-white/70 md:ml-16 md:text-2xl"
      >Community</span
    >
    <span
      class="absolute top-full left-1/2 mt-6 -translate-x-1/2 whitespace-nowrap font-orbitron text-sm uppercase tracking-widest text-white/70 md:mt-16 md:text-2xl"
      >E-Commerce</span
    >

    <svg #vaseGlyph viewBox="0 0 109 185" class="h-20 w-20 md:h-70 md:w-70" fill="none">
      <path
        fill="#fff"
        d="M108.512 98.448c-4.252-30.614-28.545-34.473-33.607-37.56a9.9 9.9 0 0 1-2.732-2.428l-.102-16.084C77.473 26.41 93.26 12.008 95.488 9.18c2.699-3.43-1.62-4.116-1.62-4.116-14.44-6.752-64.295-6.752-78.736 0 0 0-4.319.686-1.62 4.116 2.226 2.828 18.015 17.231 23.417 33.196l-.102 16.084c-.66.86-1.54 1.7-2.733 2.428-5.06 3.087-29.354 6.946-33.606 37.56-4.25 30.613 20.448 79.492 27.736 82.836 1.886.866 4.565 1.627 7.812 2.232v.083q1.863.285 3.73.509c4.33.578 9.36.905 14.734.892 5.374.013 10.405-.314 14.734-.892q1.867-.224 3.73-.509v-.083c3.246-.606 5.926-1.366 7.812-2.232 7.288-3.344 31.987-52.223 27.736-82.836"
      />
    </svg>
  </div>
</section>
<div
  class="home__journey-showcase-and-product-experience relative bg-(--journey-paper)"
>
  <app-journey-showcase></app-journey-showcase>
  <app-products-showcase></app-products-showcase>
  <app-product-experience></app-product-experience>
  <app-conveyor-images></app-conveyor-images>
  <app-cta></app-cta>
  <div class="bg z-10"></div>
</div>
