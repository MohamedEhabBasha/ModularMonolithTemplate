<nav class="w-full bg-secondary" aria-label="Main navigation">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid h-20 grid-cols-2 items-center gap-4 md:grid-cols-[1fr_auto_1fr] pt-5">
      <!-- Shop link (desktop only) -->
      <div class="hidden justify-self-start md:flex">
        <a
          routerLink="/shop"
          class="rounded text-sm font-medium tracking-wide text-white transition-colors hover:text-stone-300 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-accent-red"
        >
          Shop
        </a>
      </div>

      <!-- Logo: left on mobile, centered on desktop -->
      <a
        routerLink="/"
        class="justify-self-start rounded text-xl font-bold leading-none tracking-tight focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-accent-red md:justify-self-center"
        aria-label="mwgoods home"
      >
        <span class="bg-accent-red p-0.5 rounded-[0.3rem] text-white mr-1">MW</span><span class="font-normal text-white">goods</span>
      </a>

      <!-- Cart + Sign up (desktop only) -->
      <div class="hidden items-center justify-self-end gap-3 md:flex">
        <button
          mat-icon-button
          type="button"
          class="text-white! focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-accent-red"
          matBadgeSize="small"
          matBadgeColor="warn"
          aria-label="View cart"
        >
          <mat-icon class="text-white!">shopping_cart</mat-icon>
        </button>

        <button
          type="button"
          class="rounded-md bg-accent-red px-5 py-1 text-sm font-semibold text-white transition-colors hover:bg-accent-red/90 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-white"
        >
          Sign Up
        </button>
      </div>

      <!-- Mobile menu toggle -->
      <button
        type="button"
        class="justify-self-end rounded p-2 text-white focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-accent-red md:hidden"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-menu-panel"
        aria-label="Toggle menu"
      >
        <mat-icon>{{ isMenuOpen() ? 'close' : 'menu' }}</mat-icon>
      </button>
    </div>

    <!-- Mobile dropdown panel -->
    <div
      id="mobile-menu-panel"
      class="overflow-hidden transition-[max-height,opacity] duration-300 ease-in-out motion-reduce:transition-none md:hidden"
      [class.max-h-96]="isMenuOpen()"
      [class.opacity-100]="isMenuOpen()"
      [class.max-h-0]="!isMenuOpen()"
      [class.opacity-0]="!isMenuOpen()"
    >
      <div class="flex flex-col items-start gap-4 border-t border-white/10 py-4">
        <a
          routerLink="/shop"
          (click)="closeMenu()"
          class="rounded text-sm font-medium tracking-wide text-white transition-colors hover:text-stone-300 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-accent-red"
        >
          Shop
        </a>

        <div class="flex items-center gap-3">
          <button
            mat-icon-button
            type="button"
            class="text-white! focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-accent-red"
            matBadgeSize="small"
            matBadgeColor="warn"
            aria-label="View cart"
          >
            <mat-icon class="text-white!">shopping_cart</mat-icon>
          </button>

          <button
            type="button"
            class="rounded-md bg-accent-red px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-accent-red/90 focus-visible:outline focus-visible:outline-offset-2 focus-visible:outline-white"
          >
            Sign Up
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>
