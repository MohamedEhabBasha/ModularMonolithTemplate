<div
  #screen
  class="fixed inset-0 z-9999 flex items-center justify-center bg-primary will-change-[clip-path] [clip-path:inset(0%_0%_0%_0%)]"
>
  <div class="overlay"></div>
  <span
    #percent
    class="font-orbitron text-[clamp(3rem,10vw,8rem)] font-thin tracking-[-0.03em] text-white opacity-0 z-99"
  >
    {{ displayPercent() }}%
  </span>
</div>
