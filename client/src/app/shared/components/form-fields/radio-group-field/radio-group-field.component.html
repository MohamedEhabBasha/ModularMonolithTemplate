<div>
  @if (label()) {
    <span class="mb-2 block text-xs text-black/60">{{ label() }}</span>
  }

  <mat-radio-group
    [formControl]="control()"
    [attr.aria-label]="label()"
    [attr.aria-invalid]="control().invalid && control().touched"
    class="flex flex-col gap-3"
  >
    @for (option of options(); track option.value) {
      <mat-radio-button
        [value]="option.value"
        class="flex-1 rounded-lg border border-black/60 px-3 py-2 transition-colors"
        [class.bg-accent-red/10]="control().value === option.value"
      >
        <span class="flex items-center gap-2">
          @if (option.icon) {
            <mat-icon class="text-accent-red!">{{ option.icon }}</mat-icon>
          }
          <span class="flex flex-col leading-tight">
            <span class="font-medium">{{ option.label }}</span>
            @if (option.description) {
              <span class="text-xs text-black/60">{{ option.description }}</span>
            }
          </span>
        </span>
      </mat-radio-button>
    }
  </mat-radio-group>

  @if (control().touched && activeErrorMessage(); as message) {
    <p class="mt-1 text-xs text-red-600">{{ message }}</p>
  }
</div>
