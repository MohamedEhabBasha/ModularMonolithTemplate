<section
  class="flex h-screen flex-col items-center justify-center gap-4 bg-secondary px-4 text-center text-white"
>
  <p class="text-sm font-medium uppercase tracking-widest text-accent-red">Error 500</p>
  <h1 class="text-5xl font-bold sm:text-6xl">Something went wrong</h1>
  <p class="max-w-md text-neutral-300">
    {{ error.message || 'We hit an unexpected error on our end. Please try again in a moment.' }}
  </p>

  @if (error.details) {
    <details class="mt-2 max-w-lg text-left text-sm text-neutral-400">
      <summary class="cursor-pointer text-accent-red">Technical details</summary>
      <pre class="mt-2 whitespace-pre-wrap wrap-break-word rounded-lg bg-black/30 p-4 text-xs">{{
        error.details
      }}</pre>
    </details>
  }

  <a
    routerLink="/shop"
    class="mt-4 rounded-lg bg-accent-red px-6 py-3 font-medium text-white transition-colors hover:bg-red-700"
  >
    Back to shop
  </a>
</section>
